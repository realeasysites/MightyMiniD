<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Log in | Mighty Mini Donuts Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Figtree:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-page">
<main class="login">
  <form id="loginForm">
    <h1>Mighty Dashboard</h1>
    <p>Log in to see booking requests and update your schedule.</p>
    <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-red" type="submit">Log in</button>
    <p class="err" id="loginErr" role="alert" hidden></p>
  </form>
</main>
<script src="/admin/login.js" defer></script>
</body>
</html>
